<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'] },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.1.4",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";
        import { Sparkles, Send, Copy, RefreshCw } from 'lucide-react';

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim()) return;
                setLoading(true);
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent(`Create a Midjourney prompt for: ${input}`);
                    setResult(res.response.text());
                } catch (e) {
                    setResult("에러가 발생했습니다. API 키 설정을 확인해주세요.");
                } finally { setLoading(false); }
            };

            // React.createElement를 사용하여 에러 #31을 방지합니다.
            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-6' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 border border-slate-100' },
                    React.createElement('div', { className: 'mb-8' },
                        React.createElement('div', { className: 'flex items-center gap-2 text-blue-600 font-bold mb-2' },
                            React.createElement(Sparkles, { size: 20 }), "AI Art Academy"
                        ),
                        React.createElement('p', { className: 'text-slate-500 text-sm' }, "상상을 프롬프트로 바꿔보세요.")
                    ),
                    React.createElement('div', { className: 'relative' },
                        React.createElement('input', {
                            className: 'w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:border-blue-500 transition-all',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            placeholder: '이미지 주제 입력...',
                            onKeyDown: (e) => e.key === 'Enter' && generatePrompt()
                        }),
                        React.createElement('button', {
                            onClick: generatePrompt,
                            disabled: loading,
                            className: 'absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-xl'
                        }, loading ? React.createElement(RefreshCw, { className: 'animate-spin', size: 20 }) : React.createElement(Send, { size: 20 }))
                    ),
                    result && React.createElement('div', { className: 'mt-6 p-5 bg-slate-900 rounded-3xl text-slate-200 text-sm font-mono leading-relaxed' }, result)
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
