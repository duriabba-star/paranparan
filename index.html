<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0"
      }
    }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim() || loading) return;
                setLoading(true);
                setResult("");
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent("Create a Midjourney prompt for: " + input);
                    const text = await res.response.text();
                    
                    // 결과값을 문자열로 강제 변환
                    setResult(String(text)); 
                } catch (e) {
                    setResult("에러가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                } finally {
                    setLoading(false);
                }
            };

            // 에러를 유발하던 외부 라이브러리 아이콘 대신 표준 태그와 이모지 사용
            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 border border-slate-100' },
                    React.createElement('div', { className: 'flex items-center gap-2 mb-8' },
                        React.createElement('span', { className: 'text-2xl' }, '✨'),
                        React.createElement('h1', { className: 'text-xl font-black text-slate-800' }, 'AI Art Academy')
                    ),
                    React.createElement('div', { className: 'relative' },
                        React.createElement('input', {
                            className: 'w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-700',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            placeholder: '주제를 입력하세요...',
                            onKeyDown: (e) => e.key === 'Enter' && generatePrompt()
                        }),
                        React.createElement('button', {
                            onClick: generatePrompt,
                            disabled: loading || !input.trim(),
                            className: 'absolute right-3 top-3 p-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700'
                        }, loading ? '⌛' : '🚀')
                    ),
                    result && React.createElement('div', { className: 'mt-8 p-6 bg-slate-900 rounded-3xl text-slate-200 text-sm font-mono leading-relaxed' }, 
                        result
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
