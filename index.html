<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";
        import { Sparkles, Send, RefreshCw } from 'lucide-react';

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim() || loading) return;
                setLoading(true);
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent("Create a Midjourney prompt for: " + input);
                    const text = await res.response.text();
                    setResult(text);
                } catch (e) {
                    setResult("에러가 발생했습니다. 잠시 후 다시 시도해주세요.");
                } finally {
                    setLoading(false);
                }
            };

            // Error #31 방지를 위해 모든 요소를 React.createElement로 명확히 정의
            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-3xl shadow-xl p-8' },
                    React.createElement('div', { className: 'flex items-center gap-2 mb-6' },
                        React.createElement(Sparkles, { className: 'text-blue-600', size: 24 }),
                        React.createElement('h1', { className: 'text-xl font-bold' }, 'AI Art Academy')
                    ),
                    React.createElement('div', { className: 'relative' },
                        React.createElement('input', {
                            className: 'w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            placeholder: '주제를 입력하세요...',
                            onKeyDown: (e) => e.key === 'Enter' && generatePrompt()
                        }),
                        React.createElement('button', {
                            onClick: generatePrompt,
                            disabled: loading,
                            className: 'absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-xl'
                        }, loading ? React.createElement(RefreshCw, { className: 'animate-spin' }) : React.createElement(Send))
                    ),
                    result && React.createElement('div', { className: 'mt-6 p-4 bg-slate-900 rounded-2xl text-slate-200 text-sm font-mono' }, result)
                )
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
