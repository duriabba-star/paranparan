<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        background-color: #f8fafc;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";
        import { Sparkles, Send, RefreshCw, Copy, Check } from 'lucide-react';

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);
            const [copied, setCopied] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim() || loading) return;
                setLoading(true);
                setResult("");
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent("Create a professional Midjourney AI art prompt for: " + input + ". Respond only with the prompt in English.");
                    const text = await res.response.text();
                    setResult(String(text));
                } catch (e) {
                    setResult("에러가 발생했습니다. API 키 설정을 확인해주세요.");
                } finally {
                    setLoading(false);
                }
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(result);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4' },
                React.createElement('div', { className: 'w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden' },
                    // Header
                    React.createElement('div', { className: 'bg-indigo-600 p-8 text-white' },
                        React.createElement('div', { className: 'flex items-center gap-3 mb-2' },
                            React.createElement(Sparkles, { size: 24 }),
                            React.createElement('h1', { className: 'text-2xl font-black tracking-tight' }, 'AI Art Academy')
                        ),
                        React.createElement('p', { className: 'text-indigo-100 text-sm opacity-90' }, '상상을 현실로 만드는 프롬프트 생성기')
                    ),
                    // Content
                    React.createElement('div', { className: 'p-8 space-y-6' },
                        React.createElement('div', null,
                            React.createElement('label', { className: 'block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3' }, 'Topic'),
                            React.createElement('div', { className: 'relative' },
                                React.createElement('input', {
                                    className: 'w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-700 transition-all',
                                    value: input,
                                    onChange: (e) => setInput(e.target.value),
                                    placeholder: '예: 사이버펑크 스타일의 고양이',
                                    onKeyDown: (e) => e.key === 'Enter' && generatePrompt()
                                }),
                                React.createElement('button', {
                                    onClick: generatePrompt,
                                    disabled: loading || !input.trim(),
                                    className: 'absolute right-3 top-3 bottom-3 px-4 bg-indigo-600 text-white rounded-xl shadow-lg hover:bg-indigo-700 disabled:bg-slate-200 transition-all'
                                }, loading ? React.createElement(RefreshCw, { className: 'animate-spin' }) : React.createElement(Send, { size: 20 }))
                            )
                        ),
                        // Result area
                        result && React.createElement('div', { className: 'space-y-3 animate-in fade-in slide-in-from-bottom-4' },
                            React.createElement('label', { className: 'block text-xs font-bold text-slate-400 uppercase tracking-widest' }, 'Result Prompt'),
                            React.createElement('div', { className: 'relative group' },
                                React.createElement('div', { className: 'p-6 bg-slate-900 rounded-3xl text-indigo-100 text-sm font-mono leading-relaxed' }, result),
                                React.createElement('button', {
                                    onClick: copyToClipboard,
                                    className: 'absolute top-3 right-3 p-2 bg-slate-800 text-slate-400 rounded-lg hover:text-white transition-colors'
                                }, copied ? React.createElement(Check, { size: 16, className: 'text-green-400' }) : React.createElement(Copy, { size: 16 }))
                            )
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
