<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0"
      }
    }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";
        import { Sparkles, Send, RefreshCw } from 'lucide-react';

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState(""); // 문자열로 초기화
            const [loading, setLoading] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim() || loading) return;
                setLoading(true);
                setResult(""); // 이전 결과 초기화
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent("Create a Midjourney prompt for: " + input);
                    const text = await res.response.text();
                    
                    // ✅ [해결책] 객체가 아닌 순수한 문자열만 결과에 담습니다.
                    setResult(String(text)); 
                } catch (e) {
                    setResult("에러가 발생했습니다. 잠시 후 다시 시도해주세요.");
                } finally {
                    setLoading(false);
                }
            };

            // ✅ 리액트 에러 #31을 방지하는 가장 안전한 렌더링 구조
            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 border border-slate-100' },
                    React.createElement('div', { className: 'flex items-center gap-2 mb-8' },
                        React.createElement('div', { className: 'p-2 bg-blue-600 rounded-xl' }, 
                            React.createElement(Sparkles, { className: 'text-white', size: 20 })
                        ),
                        React.createElement('h1', { className: 'text-xl font-extrabold text-slate-800' }, 'AI Art Academy')
                    ),
                    React.createElement('div', { className: 'relative' },
                        React.createElement('input', {
                            className: 'w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-700',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            placeholder: '그림 주제를 입력하세요...',
                            onKeyDown: (e) => e.key === 'Enter' && generatePrompt()
                        }),
                        React.createElement('button', {
                            onClick: generatePrompt,
                            disabled: loading || !input.trim(),
                            className: 'absolute right-3 top-3 p-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700 transition-all'
                        }, loading ? React.createElement(RefreshCw, { className: 'animate-spin', size: 20 }) : React.createElement(Send, { size: 20 }))
                    ),
                    // ✅ 결과가 존재할 때만 문자열로 렌더링
                    result ? React.createElement('div', { className: 'mt-8 p-6 bg-slate-900 rounded-3xl text-slate-200 text-sm font-mono leading-relaxed' }, result) : null
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
