<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'] },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "@google/genai": "https://esm.sh/@google/genai",
        "lucide-react": "https://esm.sh/lucide-react"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as GoogleGenAI from "@google/genai";
        import { Sparkles, Send, Copy, RefreshCw } from 'lucide-react';

        const API_KEY = "REPLACE_ME_WITH_API_KEY";

        function App() {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            const generatePrompt = async () => {
                if (!input.trim()) return;
                setLoading(true);
                try {
                    const genAI = new GoogleGenAI.GoogleGenerativeAI(API_KEY);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const res = await model.generateContent(`Create a Midjourney prompt for: ${input}`);
                    setResult(res.response.text());
                } catch (e) {
                    setResult("에러가 발생했습니다. API 키를 확인해주세요.");
                } finally { setLoading(false); }
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-6' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100' },
                    React.createElement('h1', { className: 'text-2xl font-bold mb-6 flex items-center gap-2' }, 
                        React.createElement(Sparkles, { className: 'text-blue-600' }), "AI Art Academy"),
                    React.createElement('div', { className: 'relative mb-6' },
                        React.createElement('input', {
                            className: 'w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:border-blue-500',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            placeholder: '그림 주제를 입력하세요...'
                        }),
                        React.createElement('button', {
                            onClick: generatePrompt,
                            className: 'absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-xl'
                        }, loading ? React.createElement(RefreshCw, { className: 'animate-spin' }) : React.createElement(Send))
                    ),
                    result && React.createElement('div', { className: 'p-4 bg-slate-900 rounded-2xl text-slate-200 text-sm font-mono' }, result)
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
